<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#020817"/>

  <!-- Bar chart bars -->
  <rect x="4" y="18" width="5" height="10" rx="1.5" fill="#1a2744"/>
  <rect x="4" y="18" width="5" height="10" rx="1.5" fill="#3b82f6" opacity="0.5"/>

  <rect x="10" y="13" width="5" height="15" rx="1.5" fill="#3b82f6" opacity="0.7"/>

  <rect x="16" y="8" width="5" height="20" rx="1.5" fill="#3b82f6"/>

  <rect x="22" y="11" width="5" height="17" rx="1.5" fill="#a78bfa"/>

  <!-- Trend line -->
  <polyline points="6.5,20 12.5,15 18.5,9 24.5,12"
    fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dot on trend line end -->
  <circle cx="24.5" cy="12" r="1.8" fill="#10b981"/>
</svg>
